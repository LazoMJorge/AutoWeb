serenity {
  project.name = "Serenity BDD Screenplay - AutomationTestStore"
  take.screenshots = FOR_FAILURES
  console.colors = true
}

webdriver {
  driver = chrome
  autodownload = true
  capabilities {
    browserName = "chrome"
    unhandledPromptBehavior = "ignore"
    "goog:chromeOptions" {
      args = ["--remote-allow-origins=*", "--incognito", "--window-size=1920,1080"]
    }
  }
  timeouts {
    implicitlywait = 0
    fluentwait = 15000
  }
  wait.for.timeout = 15000
}

headless.mode = false

environments {
  default {
    webdriver.base.url = "https://automationteststore.com/"
  }
}
